<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Mail Guard AI: explainable email security and phishing-indicator platform" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#12304A"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset=".5" stop-color="#2DD4BF" stop-opacity=".35"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="900" height="300" rx="20"/></clipPath>
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.rise{animation:rise 1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fill{transform-box:fill-box;transform-origin:left;animation:fill 2.2s .6s ease-out both}
@keyframes fill{from{transform:scaleX(0)}}
</style>
</defs>
<g clip-path="url(#c)">
<rect width="900" height="300" fill="url(#bg)"/>
<g stroke="#1E2A4A" stroke-width="1" opacity=".6">
<path d="M0 60H900M0 120H900M0 180H900M0 240H900M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300"/>
</g>
<rect y="-80" width="900" height="80" fill="url(#scan)"><animate attributeName="y" from="-80" to="300" dur="3.6s" repeatCount="indefinite"/></rect>
<g transform="translate(70 80) scale(6)" class="glow" fill="none" stroke="#2DD4BF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 11l3.5 2.5 3.5-2.5"/>
</g>
<g class="t">
<text x="250" y="130" font-size="54" font-weight="700" fill="#F2F5FF" class="rise">Mail Guard <tspan fill="#2DD4BF">AI</tspan></text>
<text x="252" y="170" font-size="20" fill="#A3AFC9" class="rise" style="animation-delay:.3s">Explainable email security and phishing indicators</text>
<text x="252" y="200" font-size="15" fill="#8D9ABA" class="rise" style="animation-delay:.5s">Python · Streamlit · scikit-learn · Multinomial Naive Bayes</text>
</g>
<rect x="252" y="236" width="520" height="12" rx="6" fill="#1B2644"/>
<rect x="252" y="236" width="520" height="12" rx="6" fill="#2DD4BF" class="fill"/>
<text x="790" y="247" font-size="13" fill="#A3AFC9" class="t">Risk 0–100</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
